spring:
  application:
    name: vnkapp
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  name: VNK App
  password-reset:
    expiry-minutes: 15
  referral:
    referee-discount-percent: 10
    referee-coupon-validity-days: 30
    referrer-reward-percent: 10
    referrer-coupon-validity-days: 30
    min-order-amount: 0

# N-Genius (Network International) payment gateway — sandbox credentials.
# Env vars (NGENIUS_*) still override these values when set.
ngenius:
  auth-url: ${NGENIUS_AUTH_URL:https://api-gateway.sandbox.ngenius-payments.com/identity/auth/access-token}
  api-base-url: ${NGENIUS_API_BASE_URL:https://api-gateway.sandbox.ngenius-payments.com}
  outlet-ref: ${NGENIUS_OUTLET_REF:b2e1c46c-efbd-47eb-ad53-c72f92d09bf1}
  api-key: ${NGENIUS_API_KEY:MzZlYWQ3ZjMtOTkxNS00ZDZkLTlhNTYtZTNlNjYyNjdjNGI3OmZkMmNlODcyLWFmM2ItNDgxNS1hMTk0LTZmZjA4M2JhZGZmZA==}
  action: SALE
  currency: AED
  redirect-url: ${NGENIUS_REDIRECT_URL:https://d1dfsxng7uvrcx.cloudfront.net/payment-success.html}
  cancel-url: ${NGENIUS_CANCEL_URL:https://d1dfsxng7uvrcx.cloudfront.net/payment-cancel.html}
  payment-attempts: 3
  webhook-header-name: ${NGENIUS_WEBHOOK_HEADER_NAME:X-Webhook-Secret}
  # Paste this same value as Custom Header Value in the N-Genius portal webhook.
  webhook-header-value: ${NGENIUS_WEBHOOK_HEADER_VALUE:7Wp5@4VoukB_RZ+GUJPxn-Ai3OQMdqyN}
