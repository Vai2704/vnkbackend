services:
  db:
    image: postgres:16-alpine
    container_name: vnk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnkApp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vnk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vnkApp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vnk-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NGENIUS_OUTLET_REF: ${NGENIUS_OUTLET_REF:-b2e1c46c-efbd-47eb-ad53-c72f92d09bf1}
      NGENIUS_API_KEY: ${NGENIUS_API_KEY:-}
      NGENIUS_REDIRECT_URL: ${NGENIUS_REDIRECT_URL:-}
      NGENIUS_CANCEL_URL: ${NGENIUS_CANCEL_URL:-}
      NGENIUS_WEBHOOK_HEADER_NAME: ${NGENIUS_WEBHOOK_HEADER_NAME:-}
      NGENIUS_WEBHOOK_HEADER_VALUE: ${NGENIUS_WEBHOOK_HEADER_VALUE:-}

volumes:
  vnk_pg_data:
